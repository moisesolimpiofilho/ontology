services:
  # --- Banco de Dados: Neo4j ---
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_db
    ports:
      - "7474:7474"  # Interface Web (Browser)
      - "7687:7687"  # Protocolo Bolt (para aplicações)
    environment:
      - NEO4J_AUTH=neo4j/senha_forte_neo4j # Usuário: neo4j | Senha: senha_forte_neo4j
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # --- Banco de Dados: PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=senha_forte_postgres
      - POSTGRES_DB=meubanco
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Banco de Dados: MongoDB ---
  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha_forte_mongo
    volumes:
      - mongo_data:/data/db

  flask_app:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=senha_forte_neo4j
      - PG_DSN=host=postgres dbname=meubanco user=admin password=senha_forte_postgres
      - MONGO_URI=mongodb://admin:senha_forte_mongo@mongo:27017/ontocube?authSource=admin
      - MONGO_DB=ontocube
    volumes:
      - ./web:/app
      - ./web/ontology:/app/ontology
    depends_on:
      - neo4j
      - postgres
      - mongo

# Define os volumes para persistência dos dados (evita perder dados ao parar containers)
volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  mongo_data: